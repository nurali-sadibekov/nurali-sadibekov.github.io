<header class="relative flex w-full flex-row items-center justify-center gap-5 pt-6 pb-6 sm:w-auto sm:justify-start sm:gap-10 sm:py-12">
  {{ partial "header/avatar" . }}

  <div class="hidden flex-col gap-5 sm:flex">
    {{ partial "header/title" . }}
    {{ partial "header/nav" (dict "page" .) }}
  </div>

  <details class="absolute right-0 sm:hidden">
    <summary class="flex h-10 w-10 cursor-pointer list-none items-center justify-center rounded-md text-gray-700 dark:text-gray-300" aria-label="Open or close navigation">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </summary>
    <div class="absolute right-0 top-full z-10 mt-2 w-48 rounded-lg border border-gray-200 bg-white p-4 shadow-lg dark:border-gray-800 dark:bg-black">
      {{ partial "header/nav" (dict "page" . "mobile" true) }}
    </div>
  </details>
</header>
